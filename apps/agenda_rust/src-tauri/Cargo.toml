[package]
name = "agenda_app"
version = "0.1.0"
description = "Agenda Tauri App (in-process backend)"
edition = "2021"

[lib]
name = "agenda_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.5.0", features = ["devtools", "webview-data-url"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-process = "2"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
agenda_rust = { path = ".." }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
migration = { path = "../migration" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.48", features = ["Win32_UI_WindowsAndMessaging"] }

[package.metadata.tauri.bundle.windows]
webviewInstallMode = "downloadBootstrapper"
nsis = { installerIcon = "icons/icon.ico", displayLanguageSelector = false }
wix = { language = "en-US" }
[package.metadata.tauri.bundle.windows.windowsAttributes]
type = "WindowsAttributes"
gui = true
